<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #181123;
            min-width:460px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* 改为左对齐 */
            padding: 1em;
        }

        .gradient-text {
            background-image: linear-gradient(90deg, rgba(0, 255, 113, 1) 0%, rgba(0, 190, 140, 1) 21%, rgba(3, 150, 170, 1) 51%, rgba(6, 84, 170, 1) 100%);
            background-size: 100%;
            background-repeat: repeat;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: "Archivo Black", sans-serif;
            font-size: 2.5em;
            text-align: left; /* 标题左对齐 */
            margin: 0;
            margin-bottom: 0.5em;
            color: white;
        }

        button {
            border: none;
            cursor: pointer;
            margin-bottom: 1em;
            padding: 2.5%;
            width: 20em;
            border-radius: 8px;
        }

        .groupName {
            margin-bottom: 0.7em;
            color: white;
            font-size: 1.5em;
        }

        .inputLabel {
            color: white;
        }

        #saveMeta {
            margin-bottom: 1em;
        }

        #content {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 内容左对齐 */
            width: 100%;
        }

        .contact a {
            color: #ffffff;
        }

        .contact {
            text-align: left; /* 联系信息左对齐 */
            margin: 5px 0;
            color: white;
        }
        .contact-container {
            display: flex;
            justify-content: flex-start; /* 左对齐 */
            flex-wrap: wrap; /* 允许换行 */
            gap: 1em; /* 设置间距 */
        }
        #toggleGroup {
            display: flex;
            justify-content: flex-start; /* 选择类型左对齐 */
            margin-bottom: 1em;
        }

        #toggleGroup label {
            color: white;
            margin-right: 1em;
            cursor: pointer;
        }


        .radio-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 单选按钮组左对齐 */
            margin-bottom: 1em;
        }

        .radio-group label {
            color: white;
            margin-bottom: 0.5em;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            margin-right: 0.5em;
        }
        /* Execution progress modal: covers the popup so nothing can be
           clicked while a script runs. Updated by the injected scripts. */
        #progressOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }
        #progressOverlay[hidden] {
            display: none;
        }
        #progressBox {
            width: 80%;
            padding: 1.5em;
            border-radius: 8px;
            background-color: #181123;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            color: white;
            text-align: center;
        }
        #progressClose {
            width: auto;
            margin: 1em 0 0;
            padding: 0.6em 2em;
        }
        #inputText {
            padding: 4%;
            border-radius: 8px;
            width: 20em;
        }
        #execute {
            margin-top: 1em;
            margin-bottom: 3em;
            width: 100%;
            height: 3em;
        }
        #textGroup {
            display: none; /* 默认隐藏 */
        }
        #savedGroup {
            display: none; /* shown when copy_saved is selected */
        }
        #savedStatus {
            color: white;
            margin-bottom: 0.5em;
        }
    </style>
</head>
<body>
    <div id="content">
        <h1 class="gradient-text">MagicScript</h1>
        <div id="progressOverlay" hidden>
            <div id="progressBox" role="dialog" aria-modal="true" aria-labelledby="progressText">
                <div id="progressText" role="status"></div>
                <button id="progressClose">Close</button>
            </div>
        </div>

        <div class="groupName">Platform</div>
        <div id="toggleGroup">
            <label>
                <input type="radio" name="platformType" value="iOS" checked>
                iOS
            </label>
            <label>
                <input type="radio" name="platformType" value="macOS">
                macOS
            </label>
            <label>
                <input type="radio" name="platformType" value="tvOS">
                tvOS
            </label>
            <label>
                <input type="radio" name="platformType" value="visionOS">
                visionOS
            </label>
        </div>

        <div class="groupName">Position</div>
        <div id="toggleGroup">
            <label>
                <input type="radio" name="type" value="whatsNew" checked>
                What's New
            </label>
            <label>
                <input type="radio" name="type" value="promotionalText">
                Promotional Text
            </label>
        </div>



        <div class="groupName">Copy and paste</div>
        <div class="radio-group">
            <label>
                <input type="radio" name="copyOption" value="copy_latest" checked>
                from the previous version to the latest version
            </label>
            <label>
                <input type="radio" name="copyOption" value="copy_primary">
                from the primary language to all other languages
            </label>
            <label>
                <input type="radio" name="copyOption" value="copy_primary_translation">
                from one language to all other languages with translation
            </label>
            <label>
                <input type="radio" name="copyOption" value="copy_saved">
                from the saved text to the latest version
            </label>
        </div>

        <div id="savedGroup">
            <div id="savedStatus"></div>
            <button id="saveTexts">Save current texts</button>
            <button id="editSaved">Edit saved texts</button>
        </div>

        <div class="groupName" id="textGroup">
            <div>Text</div>
            <div class="radio-group">
                <input type="text" id="inputText" name="inputText" placeholder="Enter your text here">
            </div>
        </div>
        <button id="execute">Execute</button>

        <!-- <div class="groupName">History</div>
        <div id="saveMeta">
            <input type="checkbox" id="saveMetaData" name="saveMetaData">
            <label class="inputLabel" for="saveMetaData">Save the latest version of metadata before submitting automatically</label><br>
        </div>
        <button id="history">View history of metadata</button> -->

        <div class="contact-container">
            <div class="contact"><a href='https://x.com/masoncaiws' target='_blank'>Twitter: masoncaiws</a></div>
            <div class="contact">|</div>
            <div class="contact">WeChat: caiwenshuo</div>
            <div class="contact">|</div>
            <div class="contact">Email: cswenshuo@gmail.com</div>
            <div class="contact">GitHub: <a href="https://github.com/caiwenshuo/MagicScript-Public" target="_blank">github.com/caiwenshuo/MagicScript-Public</a></div>
            <div class="contact">If you think MagicScript helps you, please rate us in <a href='https://chromewebstore.google.com/detail/magicscript-app-store-con/dibilpekhfnlccjpcgkkancjamoeljcp' target='_blank'>Chrome Web Store</a></div>

    </div>
</body>
<script src="scripts/popup.js"></script>
</html>
